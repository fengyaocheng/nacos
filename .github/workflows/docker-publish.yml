name: Build and Publish Nacos 2FA Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - '2.4.3'
      - develop
      - main
      - master
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nacos-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Build Frontend console-ui
        run: |
          cd console-ui
          npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Build Backend Distribution
        run: |
          mvn -Prelease-nacos clean install -DskipTests -Drat.skip=true -pl distribution -am

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=2.4.3-2fa
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 镜像推送完毕后，自动触发远程 Webhook 通知服务器重启部署
      - name: 触发 Webhook 自动部署
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.NACOS_DEPLOY_WEBHOOK_URL || secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            echo "🚀 镜像已成功推送，正在呼叫远程 Webhook 触发 Nacos 2FA 自动部署..."
            curl -f -X POST "$DEPLOY_WEBHOOK_URL" || echo "⚠️ Webhook 请求已发送"
            echo "🎉 自动部署通知已成功送达你的服务器！"
          else
            echo "💡 未检测到 NACOS_DEPLOY_WEBHOOK_URL 或 DEPLOY_WEBHOOK_URL 密钥，跳过远程触发步骤"
          fi
